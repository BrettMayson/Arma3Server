[package]
name = "arma3server"
version = "0.1.0"
edition = "2024"

[lints.rust]
future_incompatible = "warn"
nonstandard_style = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
cognitive_complexity = "allow"
too_many_lines = "allow"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
indicatif = "0.18.6"
owo-colors = "4.3.0"
prost = "0.14.4"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
steamroom = { git = "https://github.com/landaire/steamroom", rev = "4dd310cb98d94f2acb99ea62d5996284bd080bca", version = "0.4.0" }
steamroom-client = { git = "https://github.com/landaire/steamroom", rev = "4dd310cb98d94f2acb99ea62d5996284bd080bca", version = "0.4.0" }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "process", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
walkdir = "2.5.0"
zip = "8.6.0"
